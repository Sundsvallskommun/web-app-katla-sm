version: '3'
services:
  backend:
    # Alla backend-variabler (API-nycklar, SAML, SECRET_KEY, ORIGIN, loggning)
    # läses direkt från backend/.env.production.local vid uppstart. Filen ligger
    # i backend/.dockerignore och bakas alltså inte in i imagen.
    #
    # OBS: värden härifrån är inte tillgängliga för ${...}-interpolation i
    # compose-filerna - endast portar och containernamn interpoleras, och de
    # kommer från root-.env.
    env_file:
      - ./backend/.env.production.local
    environment:
      # Pinnas här så att ett ev. PORT i env_file (t.ex. PORT=3001 som i
      # .env.example.local) inte kan gå isär med portmappningen i
      # docker-compose.yml. environment vinner över env_file.
      PORT: "3000"
      NODE_ENV: ${NODE_ENV-production}
  frontend:
    environment:
      # NEXT_PUBLIC_* bakas in i bundlen vid build och läses från
      # frontend/.env.local - den här raden gör inget i runtime utan finns
      # kvar som guard för att root-.env verkligen är ifylld.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?err}
