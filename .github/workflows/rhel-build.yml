name: RHEL 8.10 build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: rhel-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  YARN_VERSION: 1.22.22

jobs:
  build:
    name: Workspaces and isolated artifacts (RHEL 8.10)
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi8/ubi:8.10
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.yarn-cache
      APP_MODE: katla
      KATLA_ID: avvikelse
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_SESSION_COOKIE_NAME: katla.avvikelse.sid
      DOMAIN_NAME: localhost
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_PROTECTED_ROUTES: ''
      HEALTH_AUTH: 'false'
      HEALTH_USERNAME: ''
      HEALTH_PASSWORD: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Install OS build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git tar gzip xz gcc-c++ make python3
          dnf clean all
      - uses: actions/checkout@v7
      - name: Install pinned Node.js
        run: |
          set -euo pipefail
          NODE_VERSION="$(tr -d '[:space:]v' < .nvmrc)"
          curl --proto '=https' --proto-redir '=https' -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          mkdir -p /usr/local/lib/nodejs
          tar -xJf /tmp/node.tar.xz -C /usr/local/lib/nodejs
          echo "/usr/local/lib/nodejs/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
      - run: npm install --global --ignore-scripts "yarn@${YARN_VERSION}"
      - uses: actions/cache@v4
        with:
          path: ${{ env.YARN_CACHE_FOLDER }}
          key: rhel8-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: rhel8-yarn-
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 1000000
      - run: yarn definitions:build
      - run: yarn workspace backend build
      - run: yarn workspace katla-web-app build
      - run: yarn standalone:prepare && yarn standalone:check
      - run: node scripts/backend-artifact.mjs
      - run: yarn --cwd /tmp/katla-backend-artifact install --frozen-lockfile --production --ignore-scripts
      - run: node scripts/backend-smoke.mjs
