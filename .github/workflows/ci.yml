name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    name: Definitions and developer commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 1000000
      - run: node .github/scripts/verify-node-runtime-contract.mjs
      - run: yarn test:platform
      - run: yarn format:platform:check
      - run: yarn katla:check avvikelse --policy deploy/catalogue.example.json
      - run: yarn katla:check schema-test --test --policy deploy/catalogue.test.example.json

  checks:
    name: ${{ matrix.workspace }} – lint, format, types and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, katla-web-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 1000000
      - run: yarn definitions:build
      - run: yarn workspace ${{ matrix.workspace }} lint:strict
      - run: yarn workspace ${{ matrix.workspace }} format:check
      - run: yarn workspace ${{ matrix.workspace }} type-check
      - run: yarn workspace ${{ matrix.workspace }} test

  frontend-e2e:
    name: ${{ matrix.target }} – build, isolated artifact and browser tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: avvikelse-test
            mode: katla
            katlaId: avvikelse-test
            port: 3000
            apiPort: 3001
            basePath: ''
            config: playwright.config.ts
          - target: schema-test
            mode: katla
            katlaId: schema-test
            port: 3200
            apiPort: 3201
            basePath: ''
            config: playwright.schema.config.ts
          - target: catalogue
            mode: catalogue
            katlaId: ''
            port: 3100
            apiPort: 3101
            basePath: /portal
            config: playwright.catalogue.config.ts
    env:
      APP_MODE: ${{ matrix.mode }}
      KATLA_ID: ${{ matrix.katlaId }}
      TEST: 'true'
      PORT: ${{ matrix.port }}
      NEXT_PUBLIC_API_URL: http://localhost:${{ matrix.apiPort }}/api
      NEXT_PUBLIC_SESSION_COOKIE_NAME: katla.${{ matrix.target }}.sid
      NEXT_PUBLIC_CATALOGUE_URL: http://localhost:3100/portal
      DOMAIN_NAME: localhost
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.basePath }}
      NEXT_PUBLIC_PROTECTED_ROUTES: ''
      HEALTH_AUTH: 'false'
      HEALTH_USERNAME: ''
      HEALTH_PASSWORD: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 1000000
      - run: yarn definitions:build
      - run: yarn workspace katla-web-app playwright install --with-deps chromium
      - run: yarn workspace katla-web-app build
      - run: yarn standalone:prepare
      - run: yarn standalone:check
      - run: yarn workspace katla-web-app playwright test --config ${{ matrix.config }}
        env:
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.target }}
          path: |
            frontend/playwright-report
            frontend/test-results*
          retention-days: 14

  backend-artifact:
    name: Standalone backend with production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 1000000
      - run: yarn definitions:build && yarn workspace backend build
      - run: node scripts/backend-artifact.mjs "$RUNNER_TEMP/katla-api"
      - run: yarn --cwd "$RUNNER_TEMP/katla-api" install --frozen-lockfile --production --ignore-scripts
      - run: node scripts/backend-smoke.mjs "$RUNNER_TEMP/katla-api"

  images:
    name: Shared Dockerfiles build without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f backend/Dockerfile -t katla-api:ci .
      - run: >-
          docker build -f frontend/Dockerfile -t katla-web:avvikelse-ci
          --build-arg APP_MODE=katla --build-arg KATLA_ID=avvikelse
          --build-arg NEXT_PUBLIC_API_URL=https://avvikelse.example.invalid/api
          --build-arg NEXT_PUBLIC_SESSION_COOKIE_NAME=katla.avvikelse.sid
          --build-arg NEXT_PUBLIC_CATALOGUE_URL=https://katla.example.invalid .
      - run: >-
          docker build -f frontend/Dockerfile -t katla-web:catalogue-ci
          --build-arg APP_MODE=catalogue
          --build-arg NEXT_PUBLIC_API_URL=https://katla.example.invalid/api
          --build-arg NEXT_PUBLIC_SESSION_COOKIE_NAME=katla.catalogue.sid .
