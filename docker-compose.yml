# All instances use these same Dockerfiles. Configuration is supplied per instance.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE to the protected server environment file}
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_MODE: ${APP_MODE:?Set APP_MODE to katla or catalogue}
      KATLA_ID: ${KATLA_ID-}
      KATLA_CATALOGUE_FILE: /app/config/catalogue.json
    expose: ['3000']
    volumes:
      # Mount the directory so atomic catalogue.json replacement is visible to running instances.
      - ${KATLA_CONFIG_DIR:?Set KATLA_CONFIG_DIR to the shared policy directory}:/app/config:ro
      - data:/app/data
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_MODE: ${APP_MODE:?Set APP_MODE}
        KATLA_ID: ${KATLA_ID-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public API root}
        NEXT_PUBLIC_CATALOGUE_URL: ${NEXT_PUBLIC_CATALOGUE_URL-}
        NEXT_PUBLIC_SESSION_COOKIE_NAME: ${NEXT_PUBLIC_SESSION_COOKIE_NAME:?Must match backend SESSION_COOKIE_NAME}
        DOMAIN_NAME: ${DOMAIN_NAME-}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH-}
        ADMIN_URL: ${ADMIN_URL-}
        NEXT_PUBLIC_PROTECTED_ROUTES: ${NEXT_PUBLIC_PROTECTED_ROUTES-}
        NEXT_PUBLIC_INACTIVITY_WARNING_TIMEOUT: ${NEXT_PUBLIC_INACTIVITY_WARNING_TIMEOUT-1500000}
        NEXT_PUBLIC_INACTIVITY_COUNTDOWN_TIMEOUT: ${NEXT_PUBLIC_INACTIVITY_COUNTDOWN_TIMEOUT-300000}
    expose: ['3000']
    environment:
      NODE_ENV: production
      PORT: 3000
      HEALTH_AUTH: ${HEALTH_AUTH-false}
      HEALTH_USERNAME: ${HEALTH_USERNAME-}
      HEALTH_PASSWORD: ${HEALTH_PASSWORD-}
      ADMIN_URL: ${ADMIN_URL-}
volumes:
  data:
